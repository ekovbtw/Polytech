<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyMaker — Выбор режима</title>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { margin: 0; }
    .mode-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--bg);
    }
    .mode-top-bar {
      position: fixed;
      top: 16px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .mode-logo {
      font-family: var(--font-heading);
      font-size: 2.4rem;
      margin-bottom: 10px;
      text-align: center;
      color: var(--almost-black);
    }
    .mode-logo span { color: var(--green); }
    .mode-subtitle {
      color: var(--graphite);
      text-align: center;
      margin-bottom: 52px;
      font-size: 15px;
    }
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      max-width: 820px;
      width: 100%;
    }
    @media (max-width: 620px) { .mode-grid { grid-template-columns: 1fr; } }
    .mode-card {
      background: var(--white);
      border: 2px solid var(--gray-light);
      border-radius: 24px;
      padding: 44px 36px 36px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .mode-card, .mode-card:hover, .mode-card *, .mode-card:hover * { text-decoration: none; }
    .mode-card:hover { transform: translateY(-6px); }
    .mode-card.tests:hover  { border-color: var(--green);  box-shadow: 0 16px 40px rgba(88,101,242,0.2); }
    .mode-card.kahoot:hover { border-color: #5865f2; box-shadow: 0 16px 40px rgba(88,101,242,0.15); }
    .mode-icon { font-size: 4rem; line-height: 1; margin-bottom: 6px; }
    .mode-title { font-family: var(--font-heading); font-size: 1.6rem; color: var(--almost-black); }
    .mode-desc  { font-size: 14px; color: var(--graphite); line-height: 1.55; max-width: 260px; }
    .mode-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: rgba(88,101,242,0.12);
      color: #5865f2;
    }
    .mode-cta {
      margin-top: 10px;
      padding: 10px 28px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 800;
      transition: opacity 0.15s;
    }
    .mode-card.tests  .mode-cta { background: var(--green);  color: #fff; }
    .mode-card.kahoot .mode-cta { background: #5865f2; color: #fff; }
    .mode-card:hover .mode-cta { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="mode-top-bar">
    <button class="theme-toggle-btn" id="theme-btn" onclick="_toggleTheme()" title="Тема">🌙</button>
    <a href="/profile.html" id="profile-link" class="btn btn-secondary btn-sm" style="text-decoration:none;">👤 Профиль</a>
  </div>

  <div class="mode-page">
    <div class="mode-logo">Poly<span>Maker</span></div>
    <p class="mode-subtitle">Выберите режим работы</p>

    <div class="mode-grid">
      <a href="/dashboard.html" class="mode-card tests">
        <div class="mode-icon">📝</div>
        <div class="mode-title">Режим тестов</div>
        <div class="mode-desc">Создавайте тесты, назначайте классам, анализируйте результаты</div>
        <span class="mode-cta">Войти →</span>
      </a>

      <a href="/kahoot.html" class="mode-card kahoot">
        <div class="mode-icon">🎮</div>
        <div class="mode-title">Kahoot-режим</div>
        <span class="mode-badge">Скоро</span>
        <div class="mode-desc">Интерактивные викторины в реальном времени с живыми игроками</div>
        <span class="mode-cta">Смотреть →</span>
      </a>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    Auth.requireAuth();
    // sync theme button text
    document.getElementById('theme-btn').textContent =
      localStorage.getItem('qm_theme') === 'dark' ? '☀️' : '🌙';

    // profile link label
    const u = Auth.getUser();
    if (u) {
      const init = ((u.first_name?.[0]||'')+(u.last_name?.[0]||'')||u.username[0]).toUpperCase();
      document.getElementById('profile-link').textContent = '👤 ' + (u.first_name || u.username);
    }
  </script>
</body>
</html>
