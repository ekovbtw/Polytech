<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прохождение теста — PolyMaker</title>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar"><div id="navbar"></div></header>

  <main class="page-content">
    <div class="container">
      <div class="take-test-container">

        <!-- ── Экран загрузки ── -->
        <div id="screen-loading" class="text-center" style="padding:80px 20px;">
          <div style="font-size:3rem;">⏳</div>
          <p class="text-gray mt-16">Загружаем тест…</p>
        </div>

        <!-- ── Экран входа (пароль / имя) ── -->
        <div id="screen-entry" class="d-none">
          <div class="card" style="max-width:480px; margin:0 auto;">
            <div style="text-align:center; margin-bottom:24px;">
              <div style="font-size:2.5rem;">🔐</div>
              <h2 style="font-family:var(--font-heading); margin-top:8px;" id="entry-title">Вход в тест</h2>
              <p class="text-gray text-sm mt-8" id="entry-meta"></p>
            </div>
            <div id="entry-alert" class="alert"></div>

            <div id="password-entry" class="d-none form-group">
              <label class="form-label">🔒 Пароль к тесту</label>
              <div class="password-wrapper">
                <input id="entry-password" class="form-input" type="password" placeholder="Введите пароль">
                <button type="button" class="password-toggle">👁️</button>
              </div>
            </div>

            <div id="name-entry" class="d-none form-group">
              <label class="form-label" id="name-label">Ваше имя</label>
              <input id="entry-name" class="form-input" type="text"
                placeholder="Введите ваше имя или псевдоним">
            </div>

            <button class="btn btn-primary btn-block btn-lg" onclick="startTest()" id="start-btn">
              Начать тест →
            </button>
          </div>
        </div>

        <!-- ── Экран теста ── -->
        <div id="screen-test" class="d-none">
          <div style="margin-bottom:24px;">
            <h2 style="font-family:var(--font-heading);" id="test-title-display">—</h2>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px; flex-wrap:wrap; gap:8px;">
              <span class="text-gray text-sm" id="progress-text">Вопрос 0 из 0</span>
              <span class="text-gray text-sm" id="answered-count">Отвечено: 0</span>
              <span id="timer-display" class="d-none" style="font-family:var(--font-heading);font-size:1.1rem;padding:4px 14px;border-radius:20px;background:var(--green-light);color:var(--green-dark);">⏱️ --:--</span>
            </div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>

          <div id="questions-list"></div>

          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
            <button class="btn btn-primary btn-lg" onclick="submitTest()" id="submit-btn">
              ✅ Завершить и отправить
            </button>
            <a href="/dashboard.html" class="btn btn-secondary btn-lg">Отмена</a>
          </div>
        </div>

        <!-- ── Экран: результаты скрыты ── -->
        <div id="screen-hidden" class="d-none text-center" style="padding:60px 20px;">
          <div style="font-size:3.5rem;">📬</div>
          <h2 style="font-family:var(--font-heading); margin:16px 0 8px;">Тест отправлен!</h2>
          <p class="text-gray">Преподаватель скрыл результаты. Вы узнаете оценку позже.</p>
          <a href="/dashboard.html" class="btn btn-primary mt-24">На главную</a>
        </div>

      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    renderNavbar();
    initPasswordToggles();

    const params = new URLSearchParams(location.search);
    const testId   = params.get('id');
    const testCode = params.get('code');

    let testInfo    = null;
    let questions   = [];
    let userAnswers = {};
    let timerInterval = null;

    if (!testId) { window.location.href = '/dashboard.html'; }

    // ── Начальная загрузка метаданных ──
    (async () => {
      try {
        const code = testCode || testId;
        const meta = await API.get(`/api/public/tests/${code}`);
        testInfo = meta;
        showEntryScreen(meta);
      } catch (err) {
        document.getElementById('screen-loading').innerHTML = `
          <div style="font-size:3rem;">😕</div>
          <h3 style="font-family:var(--font-heading); margin:12px 0 8px;">Тест не найден</h3>
          <p class="text-gray">${err.message}</p>
          <a href="/dashboard.html" class="btn btn-primary mt-24">На главную</a>`;
      }
    })();

    function showEntryScreen(meta) {
      // Check deadline before showing form
      if (meta.deadline_at && new Date() > new Date(meta.deadline_at)) {
        document.getElementById('screen-loading').innerHTML = `
          <div style="font-size:3rem;">🔒</div>
          <h3 style="font-family:var(--font-heading);margin:12px 0 8px;">Срок сдачи истёк</h3>
          <p class="text-gray">Тест был закрыт ${fmtDate(meta.deadline_at)}</p>
          <a href="/dashboard.html" class="btn btn-primary mt-24">На главную</a>`;
        return;
      }
      document.getElementById('screen-loading').classList.add('d-none');
      document.getElementById('screen-entry').classList.remove('d-none');
      document.getElementById('entry-title').textContent = meta.title;
      let metaTxt = `${meta.question_count} вопросов`;
      if (meta.time_limit_minutes) metaTxt += ` · ⏱️ ${meta.time_limit_minutes} мин`;
      if (meta.deadline_at) metaTxt += ` · до ${fmtDate(meta.deadline_at)}`;
      document.getElementById('entry-meta').textContent = metaTxt;

      if (meta.has_password) {
        document.getElementById('password-entry').classList.remove('d-none');
      }

      const user = Auth.getUser();
      if (!user) {
        // не авторизован — просим имя (если не анонимный — обязательно)
        const nameDiv = document.getElementById('name-entry');
        nameDiv.classList.remove('d-none');
        const label = document.getElementById('name-label');
        if (meta.is_anonymous) {
          label.innerHTML = 'Ваше имя <span class="text-gray" style="font-weight:500;">(необязательно)</span>';
          document.getElementById('entry-name').placeholder = 'Аноним';
        } else {
          label.textContent = 'Ваше имя *';
          document.getElementById('entry-name').placeholder = 'Введите имя';
          document.getElementById('entry-name').required = true;
        }
      } else if (meta.is_anonymous) {
        // авторизован, но тест анонимный — предлагаем псевдоним
        const nameDiv = document.getElementById('name-entry');
        nameDiv.classList.remove('d-none');
        document.getElementById('name-label').innerHTML =
          'Псевдоним <span class="text-gray" style="font-weight:500;">(необязательно)</span>';
        document.getElementById('entry-name').placeholder = user.username;
      }
    }

    async function startTest() {
      const alert = document.getElementById('entry-alert');
      hideAlert(alert);

      const user = Auth.getUser();
      const password = document.getElementById('entry-password').value || '';
      const nameVal  = document.getElementById('entry-name').value.trim();

      if (testInfo.has_password && !password) {
        showAlert(alert, 'Введите пароль для доступа к тесту');
        return;
      }
      if (!user && !testInfo.is_anonymous && !nameVal) {
        showAlert(alert, 'Введите ваше имя');
        return;
      }

      document.getElementById('start-btn').disabled = true;
      document.getElementById('start-btn').textContent = 'Загружаем…';

      try {
        const data = await API.post(`/api/public/tests/${testInfo.id}/questions`, { password });
        testInfo   = data.test;
        questions  = data.questions;

        // определяем имя
        if (user) {
          testInfo._studentName = nameVal || user.username;
          testInfo._userId      = user.id;
        } else {
          testInfo._studentName = nameVal || 'Аноним';
          testInfo._userId      = null;
        }
        testInfo._password = password;

        renderTestScreen();
      } catch (err) {
        showAlert(alert, err.message);
        document.getElementById('start-btn').disabled = false;
        document.getElementById('start-btn').textContent = 'Начать тест →';
      }
    }

    function renderTestScreen() {
      document.getElementById('screen-entry').classList.add('d-none');
      document.getElementById('screen-test').classList.remove('d-none');
      document.getElementById('test-title-display').textContent = testInfo.title || 'Тест';
      updateProgress();

      // Start countdown timer if test has time limit
      if (testInfo.time_limit_minutes) {
        const key = `qm_timer_${testInfo.id}`;
        let startedAt = sessionStorage.getItem(key);
        if (!startedAt) {
          startedAt = Date.now();
          sessionStorage.setItem(key, startedAt);
        }
        const limitMs  = testInfo.time_limit_minutes * 60 * 1000;
        const timerEl  = document.getElementById('timer-display');
        timerEl.classList.remove('d-none');

        timerInterval = setInterval(() => {
          const elapsed   = Date.now() - Number(startedAt);
          const remaining = Math.max(0, limitMs - elapsed);
          const mins = Math.floor(remaining / 60000);
          const secs = Math.floor((remaining % 60000) / 1000);
          timerEl.textContent = `⏱️ ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
          if (remaining < 60000) {
            timerEl.style.background = '#ffebee';
            timerEl.style.color      = '#c62828';
          }
          if (remaining <= 0) {
            clearInterval(timerInterval);
            sessionStorage.removeItem(key);
            timerEl.textContent = '⏱️ 00:00';
            showToast('Время вышло! Отправляем тест…', 'error');
            setTimeout(() => submitTest(), 1500);
          }
        }, 1000);
      }

      const list = document.getElementById('questions-list');
      list.innerHTML = questions.map((q, i) => buildQuestionCard(q, i)).join('');

      // Attach event listeners after render
      questions.forEach(q => attachQuestionListeners(q));
    }

    function buildQuestionCard(q, i) {
      const type = q.type || 'single_choice';
      const imgHtml = q.image_url
        ? `<div style="margin:10px 0;"><img src="${escHtml(q.image_url)}" style="max-width:100%;max-height:280px;border-radius:12px;border:2px solid var(--gray-light);" alt="Изображение к вопросу"></div>`
        : '';

      let answerHtml = '';
      if (type === 'single_choice') {
        answerHtml = q.answers.map(a => `
          <label class="answer-option" id="ao-${q.id}-${a.id}">
            <input type="radio" name="q${q.id}" value="${a.id}">
            <div class="answer-dot"></div>
            <span>${escHtml(a.answer_text)}</span>
          </label>`).join('');
      } else if (type === 'multiple_choice') {
        answerHtml = `<p class="text-gray text-sm" style="margin-bottom:8px;">Выберите все правильные варианты:</p>` +
          q.answers.map(a => `
          <label class="answer-option" id="ao-${q.id}-${a.id}">
            <input type="checkbox" name="q${q.id}" value="${a.id}">
            <div class="answer-dot" style="border-radius:4px;"></div>
            <span>${escHtml(a.answer_text)}</span>
          </label>`).join('');
      } else if (type === 'text_answer') {
        answerHtml = `
          <p class="text-gray text-sm" style="margin-bottom:8px;">Введите ваш ответ:</p>
          <textarea class="take-text-answer" id="text-ans-${q.id}"
            placeholder="Напишите ответ здесь…" rows="3"
            oninput="onTextInput(${q.id}, this.value)"></textarea>`;
      } else if (type === 'number_answer') {
        answerHtml = `
          <p class="text-gray text-sm" style="margin-bottom:8px;">Введите число:</p>
          <input type="number" step="any" class="take-number-answer" id="num-ans-${q.id}"
            placeholder="0"
            oninput="onTextInput(${q.id}, this.value)">`;
      } else if (type === 'file_answer') {
        answerHtml = `
          <div class="file-upload-zone" id="fzone-${q.id}" onclick="triggerFileInput(${q.id})">
            <div class="file-upload-icon">📎</div>
            <div class="file-upload-text">Нажмите или перетащите файл/фото</div>
            <div class="file-upload-name d-none" id="fname-${q.id}"></div>
            <img class="file-preview-img d-none" id="fpreview-${q.id}" alt="Предпросмотр">
          </div>
          <input type="file" id="finput-${q.id}" style="display:none"
            onchange="onFileSelected(${q.id}, this)">`;
      }

      return `
        <div class="test-question-card" id="qcard-${q.id}">
          <h3>${i + 1}. ${escHtml(q.question_text)}</h3>
          ${imgHtml}
          ${answerHtml}
        </div>`;
    }

    function attachQuestionListeners(q) {
      const type = q.type || 'single_choice';
      if (type === 'single_choice') {
        q.answers.forEach(a => {
          const lbl = document.getElementById(`ao-${q.id}-${a.id}`);
          if (lbl) lbl.addEventListener('click', () => selectChoice(q.id, a.id, lbl));
        });
      } else if (type === 'multiple_choice') {
        q.answers.forEach(a => {
          const lbl = document.getElementById(`ao-${q.id}-${a.id}`);
          if (lbl) {
            const cb = lbl.querySelector('input[type=checkbox]');
            // Use 'change' — browser toggles checkbox on label click, then fires change
            cb.addEventListener('change', () => {
              lbl.classList.toggle('selected', cb.checked);
              onMultipleChoiceChange(q.id, q.answers);
            });
          }
        });
      } else if (type === 'file_answer') {
        const zone = document.getElementById(`fzone-${q.id}`);
        if (zone) {
          zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
          zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
          zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleFileUpload(q.id, file);
          });
        }
      }
    }

    function selectChoice(qId, aId, el) {
      document.querySelectorAll(`#qcard-${qId} .answer-option`)
        .forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
      userAnswers[qId] = { type: 'single_choice', answer_id: aId };
      updateProgress();
    }

    function onMultipleChoiceChange(qId, answers) {
      const selected = answers
        .filter(a => {
          const cb = document.querySelector(`#ao-${qId}-${a.id} input[type=checkbox]`);
          return cb?.checked;
        })
        .map(a => a.id);
      if (selected.length > 0) {
        userAnswers[qId] = { type: 'multiple_choice', answer_ids: selected };
      } else {
        delete userAnswers[qId];
      }
      updateProgress();
    }

    function onTextInput(qId, val) {
      const q = questions.find(q => q.id === qId);
      const type = q?.type || 'single_choice';
      if (val.trim()) {
        userAnswers[qId] = { type, text: val };
      } else {
        delete userAnswers[qId];
      }
      updateProgress();
    }

    function triggerFileInput(qId) {
      document.getElementById(`finput-${qId}`)?.click();
    }

    function onFileSelected(qId, input) {
      const file = input.files[0];
      if (file) handleFileUpload(qId, file);
    }

    async function handleFileUpload(qId, file) {
      const zone  = document.getElementById(`fzone-${qId}`);
      const fname = document.getElementById(`fname-${qId}`);
      const prev  = document.getElementById(`fpreview-${qId}`);

      zone.classList.add('drag-over');
      fname.textContent = '⏳ Загружаем…';
      fname.classList.remove('d-none');
      prev.classList.add('d-none');

      try {
        const formData = new FormData();
        formData.append('file', file);
        const resp = await fetch('/api/upload/answer-file', { method: 'POST', body: formData });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Ошибка загрузки');

        userAnswers[qId] = { type: 'file_answer', file_url: data.url };
        zone.classList.remove('drag-over');
        zone.classList.add('has-file');
        fname.textContent = '✅ ' + (file.name.length > 40 ? file.name.slice(0,40) + '…' : file.name);

        if (data.is_image) {
          prev.src = data.url;
          prev.classList.remove('d-none');
        }
        updateProgress();
      } catch (err) {
        zone.classList.remove('drag-over');
        fname.textContent = '❌ ' + err.message;
        showToast(err.message, 'error');
      }
    }

    function updateProgress() {
      const total    = questions.length;
      const answered = Object.keys(userAnswers).length;
      const pct      = total ? (answered / total) * 100 : 0;
      document.getElementById('progress-fill').style.width  = pct + '%';
      document.getElementById('progress-text').textContent  = `Вопросов: ${total}`;
      document.getElementById('answered-count').textContent = `Отвечено: ${answered} из ${total}`;
    }

    async function submitTest() {
      const unanswered = questions.filter(q => !userAnswers[q.id]).length;
      if (unanswered > 0) {
        const ok = confirm(`Вы не ответили на ${unanswered} вопрос(а). Завершить всё равно?`);
        if (!ok) return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Отправляем…';

      try {
        const result = await API.post('/api/submissions', {
          test_id:      testInfo.id,
          answers:      userAnswers,
          password:     testInfo._password || null,
          student_name: testInfo._studentName,
          user_id:      testInfo._userId
        });

        if (timerInterval) clearInterval(timerInterval);
        if (result.show_results) {
          window.location.href = `/results.html?id=${result.submission_id}`;
        } else {
          document.getElementById('screen-test').classList.add('d-none');
          document.getElementById('screen-hidden').classList.remove('d-none');
        }
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = '✅ Завершить и отправить';
      }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
